<!doctype html>

    <meta charset="UTF-8" />
    <title>購物清單</title>
    <style>
      /* 網頁預覽樣式 - 深色護眼強化版 */
      body {
        margin: 0;
        padding: 20px 0;
        background-color: #121212;
        font-family: "Microsoft JhengHei", Arial, sans-serif;
      }

      /* A4 畫布設定 */
      .page {
        width: 210mm;
        margin: 0 auto;
      }

      .page > h2 {
        color: #f3f4f6;
        margin-bottom: 12px;
        border-left: 5px solid #38bdf8;
        padding-left: 12px;
        letter-spacing: 1px;
      }

      .page > .store {
        background-color: #1e1e24;
        border: 1px solid #2e2e38;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        box-sizing: border-box;
        padding: 24px;
        margin-bottom: 24px;
      }

      .page > .store > div {
        display: flex;
        margin-bottom: 18px;
        gap: 14px;
      }

      .page > .store .line {
        background: #2e2e38;
        height: 2px;
        margin: 20px 0;
      }

      .page > .store > div > div {
        color: #38bdf8;
        font-size: 20px;
        flex: 1;
        position: relative;
        max-width: calc(100% / 3);
      }

      /* 純文字項目 */
      .page > .store > div > .box.noImage {
        font-size: 32px;
        background: #272730;
        border: 2px solid #38bdf8;
        color: #f3f4f6;
        padding: 30px 12px;
        font-weight: bolder;
        border-radius: 12px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* 商品圖片 */
      .page > .store > div > .box > img {
        width: 100%;
        border-radius: 12px;
        border: 2px solid transparent;
        box-sizing: border-box;
        transition: all 0.2s ease;
      }

      /* 自己的數量標籤（沉穩亮藍，不搶戲） */
      .page > .store > div > .box > b {
        position: absolute;
        right: 8px;
        top: 12px;
        background: #38bdf8;
        color: #0f172a;
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        text-align: left;
      }

      .page > .store > div > .box > b.day::after {
        content: "日";
      }

      /* =========================================
    同事代購 (.colleague) 強烈視覺提示區
    ========================================= */

      /* 1. 圖片加上動態發光外框 */
      .page > .store > div > .box.colleague > img,
      .page > .store > div > .box.colleague.noImage {
        animation: glow-box 0.8s infinite alternate;
      }

      /* 2. 標籤加上「代購」字樣與高反差閃爍 */
      .page > .store > div > .box.colleague > b {
        font-size: 16px;
        padding: 5px 12px;
        animation: blink-badge 0.8s infinite alternate;
      }

      .page > .store > div > .box.colleague > b::before {
        content: "代購 ";
        font-weight: 900;
      }

      /* 標籤動畫：螢光粉紅 <-> 亮螢光黃 */
      @keyframes blink-badge {
        0% {
          background: #ff2a85;
          color: #ffffff;
          transform: scale(1);
          box-shadow: 0 0 12px rgba(255, 42, 133, 0.8);
        }
        100% {
          background: #facc15;
          color: #000000;
          transform: scale(1.08);
          box-shadow: 0 0 16px rgba(250, 204, 21, 0.9);
        }
      }

      /* 外框發光動畫 */
      @keyframes glow-box {
        0% {
          border-color: #ff2a85;
          box-shadow: 0 0 12px rgba(255, 42, 133, 0.5);
        }
        100% {
          border-color: #facc15;
          box-shadow: 0 0 16px rgba(250, 204, 21, 0.6);
        }
      }

      /* =========================================
    已購買狀態 (.checked) - 全部熄燈變暗
    ========================================= */
      .page > .store > div > .box.checked {
        opacity: 0.25;
        filter: grayscale(100%);
      }

      .page > .store > div > .box.checked.colleague > b,
      .page > .store > div > .box.checked.colleague > img,
      .page > .store > div > .box.checked.colleague.noImage {
        animation: none;
        border-color: transparent;
        box-shadow: none;
      }
    </style>
  </head>

    <script>
      // 30cm：山田、Eve、Vaundy
      // 45cm：natori

      document.addEventListener("DOMContentLoaded", function () {
        console.log("DOMContentLoaded");
        var ary = getCookieArray("shopping_list");
        console.log(ary);
        ary.forEach(function (val) {
          var target = document.querySelector(`[data-val="${val}"]`);
          if (target) {
            target.classList.add("checked");
          }
        });
      });

      const boxes = document.querySelectorAll(".box");

      boxes.forEach((box) => {
        box.addEventListener("click", () => {
          // 切換當前被點擊元素的 checked 狀態
          box.classList.toggle("checked");

          var test = document.querySelectorAll(".checked");
          var ary = Array.from(test).map((v) => v.getAttribute("data-val"));
          setCookie("shopping_list", ary.join(","));
        });
      });

      function setCookie(name, value, days = 7) {
        const date = new Date();
        date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
        const expires = "expires=" + date.toUTCString();

        document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; ${expires}; path=/`;
      }

      function getCookieArray(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) {
          // 取出值並進行解碼
          const rawStr = decodeURIComponent(parts.pop().split(";").shift());
          // 若有內容則用逗號切回陣列，若為空字串則回傳空陣列
          return rawStr ? rawStr.split(",") : [];
        }
        return []; // 找不到該 Cookie 時回傳空陣列
      }
