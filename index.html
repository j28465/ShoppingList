<!doctype html>

    <style>
      /* 網頁預覽樣式 */
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        font-family: "Microsoft JhengHei", Arial, sans-serif;
      }

      /* A4 畫布設定 */
      .page {
        width: 210mm;
        /* height: 297mm; */
        margin: 10mm auto;
        padding: 15mm 15mm;
        background: white;
        border: 1px solid #d3d3d3;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      /* .page {
              margin: 10mm auto;
              padding: 15mm 15mm;
              display: flex;
              flex-direction: column;
            } */

      .page > h3 {
        background: #0f2ede;
        color: #fff;
        padding: 4px 16px;
      }

      .page > div {
        display: flex;
        margin-bottom: 17px;
        gap: 12px;
      }

      .page .line {
        background: #a7a7a7;
        height: 4px;
      }

      .page > div > div {
        flex: 1;
        position: relative;
        max-width: calc(100% / 3);
        text-align: center;
      }
      .page > div > .box.noImage {
        font-size: 36px;
        border: red solid 2px;
        padding: 30px 12px;
        font-weight: bolder;
      }
      .page > div > .box.checked {
        opacity: 0.3;
      }

      .page > div > .box > img {
        width: 100%;
      }

      .page > div > .box > b {
        position: absolute;
        right: 0px;
        top: 20px;
        background: red;
        color: #fff;
        padding: 4px 8px;
      }

      .page > div > .box.colleague > b {
        background: green;
        color: #fff;
        animation: blink-border 1s infinite alternate;
      }
      @keyframes blink-border {
        0% {
          background: green;
          color: #fff;
        }
        100% {
          background: yellow;
          color: black;
        }
      }
      .page > div > .box.checked.colleague > b {
        animation: none;
      }

      .page > div > .box > b.day::after {
        content: "日";
      }

      /* 列印專用樣式 */
      @page {
        size: A4 portrait;
        margin: 0; /* 清除瀏覽器預設頁首頁尾 */
      }

      @media print {
        body {
          background-color: transparent;
        }
        .page {
          margin: 0;
          border: none;
          box-shadow: none;
          width: 210mm;
          /* height: 297mm; */
          page-break-after: always;
        }
        /* 確保黑線在列印時足夠清晰 */
        .signin-table th,
        .signin-table td {
          border: 2px solid #000000 !important;
        }
        .signin-table th {
          background-color: #e6e6e6 !important;
          -webkit-print-color-adjust: exact; /* 強制列印背景顏色 */
          print-color-adjust: exact;
        }
      }
    </style>

    <script>
      // 30cm：山田、Eve、Vaundy
      // 45cm：natori

      document.addEventListener("DOMContentLoaded", function () {
        console.log("DOMContentLoaded");
        var ary = getCookieArray("shopping_list");
        console.log(ary);
        ary.forEach(function (val) {
          var target = document.querySelector(`[data-val="${val}"]`);
          if (target) {
            target.classList.add("checked");
          }
        });
      });

      const boxes = document.querySelectorAll(".box");

      boxes.forEach((box) => {
        box.addEventListener("click", () => {
          // 切換當前被點擊元素的 checked 狀態
          box.classList.toggle("checked");

          var test = document.querySelectorAll(".checked");
          var ary = Array.from(test).map((v) => v.getAttribute("data-val"));
          setCookie("shopping_list", ary.join(","));
        });
      });

      function setCookie(name, value, days = 7) {
        const date = new Date();
        date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
        const expires = "expires=" + date.toUTCString();

        document.cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}; ${expires}; path=/`;
      }

      function getCookieArray(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) {
          // 取出值並進行解碼
          const rawStr = decodeURIComponent(parts.pop().split(";").shift());
          // 若有內容則用逗號切回陣列，若為空字串則回傳空陣列
          return rawStr ? rawStr.split(",") : [];
        }
        return []; // 找不到該 Cookie 時回傳空陣列
      }
    </script>
